<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Login | Record OT 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#10233f,#1769aa);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#172337}.login{background:#fff;width:min(100%,390px);padding:28px;border-radius:20px;box-shadow:0 24px 70px #07162955}.mark{width:48px;height:48px;border-radius:14px;background:#e4f0ff;color:#1769aa;display:grid;place-items:center;font-size:24px;font-weight:800}.login h1{font-size:24px;margin:16px 0 5px}.sub{color:#6b7890;font-size:13px;line-height:1.5;margin:0 0 22px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cbd6e4;border-radius:10px;font:inherit}.field input:focus{outline:2px solid #b8d9ff;border-color:#1769aa}button{width:100%;padding:12px;border:0;border-radius:10px;background:#1769aa;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.error{font-size:13px;color:#b42335;min-height:20px}.hint{font-size:12px;color:#66758a;line-height:1.5;margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0}
</style></head>
<body><main class="login"><div class="mark">OT</div><h1>Record OT 2026</h1><p class="sub">Masuk ke aplikasi pencatatan lembur pribadi Anda.</p>
<form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="error" class="error" role="alert"></div><button type="submit">Masuk</button></form>
<div class="hint"><b>Login pertama kali</b><br>Username awal: <code>admin</code><br>Password awal: <code>ot2026!</code><br>Segera ubah kredensial setelah masuk. Login ini hanya penghalang sederhana di browser, bukan keamanan server.</div></main>
<script>
const KEY='recordOTLoginV1';
if(!localStorage.getItem(KEY)){localStorage.setItem(KEY,JSON.stringify({username:'admin',password:'ot2026!'}));}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();let creds;try{creds=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{creds={}};if(document.getElementById('username').value===creds.username&&document.getElementById('password').value===creds.password){sessionStorage.setItem('recordOTLoggedIn','yes');location.href='index.html'}else{document.getElementById('error').textContent='Username atau password tidak sesuai.'}});
</script></body></html>
